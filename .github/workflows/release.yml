name: Release

# A push to main that raises the version (package.json, src-tauri/Cargo.toml and tauri.conf.json, with a
# dated section in CHANGELOG.md) creates a draft GitHub Release for it, with that section as the notes,
# and builds the installers into it. Publishing the draft creates the tag. A push that leaves the
# version alone does nothing; scripts/release-plan.ts decides and refuses inconsistent versions.
#
# "Run workflow" from the Actions tab builds the same installers as workflow artifacts, with no release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  plan:
    name: Plan the release
    if: github.event_name == 'push' && github.repository == 'ryangswe/plica'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decide
        id: plan
        run: |
          git ls-remote --tags origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -v '\^{}$' > "$RUNNER_TEMP/tags.txt" || true
          node scripts/release-plan.ts "$RUNNER_TEMP/tags.txt" "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        id: draft
        if: steps.plan.outputs.create == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # One draft per version: if it exists (an earlier push already drafted this version), build nothing.
          if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' | grep -qx "v$VERSION"; then
            echo "A release for v$VERSION already exists; publish or delete it first." >&2
            exit 0
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Plica v$VERSION" -F draft=true -F body=@"$RUNNER_TEMP/notes.md" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Drafted v$VERSION (release $id)." >&2

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    # Runs for a new draft, or for "Run workflow" (artifacts only); a failed plan stops it.
    if: ${{ !cancelled() && !failure() && (needs.plan.outputs.release_id != '' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty for "Run workflow": build only.
          releaseId: ${{ needs.plan.outputs.release_id }}
          args: ${{ matrix.args }}
      - name: Check the macOS app's signature
        # A bundle that fails this is reported as "damaged" when downloaded (see tauri.conf.json signingIdentity).
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict -vv src-tauri/target/*/release/bundle/macos/Plica.app
      - uses: actions/upload-artifact@v4
        with:
          name: plica-${{ matrix.os }}-${{ matrix.rust_targets || 'native' }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: ignore
