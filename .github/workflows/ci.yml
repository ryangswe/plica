name: CI

# Changes to docs only (README, CHANGELOG, docs/) skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md"]
  pull_request:
    paths-ignore: ["*.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/PULL_REQUEST_TEMPLATE.md"]
  workflow_dispatch:

# A new push to a pull request cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Frontend (types, unit, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Release plan (versions agree; a new version has a dated CHANGELOG section)
        run: |
          git ls-remote --tags origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -v '\^{}$' > "$RUNNER_TEMP/tags.txt" || true
          node --experimental-strip-types scripts/release-plan.ts "$RUNNER_TEMP/tags.txt" "$RUNNER_TEMP/notes.md"
      - name: Lint the macOS install script
        run: shellcheck scripts/install-macos.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/screens
          if-no-files-found: ignore

  rust:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No debug info: compiling and linking (slowest on Windows) are faster and the cache is smaller.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        # Only what compiling needs; the installer build in release.yml installs the rest.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Pull requests reuse main's cache instead of each saving their own (~0.5-0.8 GB per OS).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Rust build embeds dist/ but only needs the folder to exist; the web job tests the frontend.
      - run: mkdir dist
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
