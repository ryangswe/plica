name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab also checks the desktop shell on macOS and Windows.
  workflow_dispatch:

jobs:
  web:
    name: Frontend (types, unit, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/screens
          if-no-files-found: ignore

  rust:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS/Windows runners cost 10x/2x minutes on private repos, so pushes only check Linux.
        # Run the workflow manually (or switch this back once the repo is public) for all three.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-22.04","macos-latest","windows-latest"]') || fromJSON('["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build # the Rust build embeds dist/
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
