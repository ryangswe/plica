[package]
name = "plica"
version = "0.1.0"
description = "A tiny, fast viewer for Markdown and other dev files"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "plica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
notify = "8"
# Text encodings (Firefox's decoder and detector): UTF-16, Windows-1252, Shift_JIS... ~215 KB.
encoding_rs = "0.8"
chardetng = "0.1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Already built as part of Tauri on macOS; used directly for native tab selection (Cmd+1…9).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSWindowTabGroup"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
